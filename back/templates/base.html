<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공연 추천 서비스</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Modern Navigation Bar -->
  <nav class="bg-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <a href="{% url 'performances:index' %}" class="flex items-center">
            <i class="fas fa-theater-masks text-indigo-600 text-2xl mr-2"></i>
            <span class="font-bold text-xl text-gray-800">공연 추천</span>
          </a>
        </div>

        <div class="flex items-center space-x-4">
          {% if user.is_authenticated %}
            <a href="{% url 'performances:index' %}" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition">
              <i class="fas fa-home mr-1"></i>공연
            </a>
            <a href="{% url 'community:index' %}" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition">
              <i class="fas fa-comments mr-1"></i>커뮤니티
            </a>
            <a href="{% url 'community:create' %}" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition">
              <i class="fas fa-pen mr-1"></i>리뷰 작성
            </a>
            <div class="flex items-center space-x-3 ml-4 pl-4 border-l border-gray-300">
              <a href="{% url 'accounts:profile' user.username %}" class="flex items-center text-gray-700 hover:text-indigo-600 transition">
                <i class="fas fa-user-circle text-xl mr-2"></i>
                <span class="font-medium">{{ user.username }}</span>
              </a>
              <form action="{% url 'accounts:logout' %}" method="POST" class="inline">
                {% csrf_token %}
                <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                  <i class="fas fa-sign-out-alt mr-1"></i>로그아웃
                </button>
              </form>
            </div>
          {% else %}
            <a href="{% url 'accounts:login' %}" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition">
              <i class="fas fa-sign-in-alt mr-1"></i>로그인
            </a>
            <a href="{% url 'accounts:signup' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
              <i class="fas fa-user-plus mr-1"></i>회원가입
            </a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}
    {% endblock content %}
  </main>
</body>
</html>
