{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

  <!-- 헤더 -->
  <div class="text-center mb-12">
    <h1 class="text-4xl font-bold text-gray-900 mb-4">
      <i class="fas fa-fire text-red-500"></i> 인기 공연 랭킹
    </h1>
    <p class="text-gray-600">
      KOPIS 예매상황판 기준 | 최종 업데이트: {{ latest_date|date:"Y년 m월 d일" }}
    </p>
  </div>

  <!-- 장르 탭 -->
  <div class="mb-8">
    <div class="border-b border-gray-200">
      <nav class="-mb-px flex space-x-8 overflow-x-auto" aria-label="Tabs" id="genre-tabs">
        {% for genre in genres %}
        <button
          data-genre="{{ genre.code }}"
          class="genre-tab whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors
                 {% if forloop.first %}border-indigo-500 text-indigo-600{% else %}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{% endif %}"
        >
          {{ genre.name }}
        </button>
        {% endfor %}
      </nav>
    </div>
  </div>

  <!-- 로딩 스피너 -->
  <div id="loading" class="hidden text-center py-12">
    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
    <p class="mt-4 text-gray-600">데이터를 불러오는 중...</p>
  </div>

  <!-- 공연 목록 캐러셀 -->
  <div id="performances-container" class="relative">

    <!-- 좌측 화살표 -->
    <button
      id="prev-btn"
      class="hidden absolute left-0 top-1/2 transform -translate-y-1/2 -translate-x-4 z-10 bg-white rounded-full p-3 shadow-lg hover:bg-gray-50 transition"
    >
      <i class="fas fa-chevron-left text-gray-600 text-xl"></i>
    </button>

    <!-- 공연 목록 -->
    <div id="performances-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
      <!-- JavaScript로 동적 생성 -->
    </div>

    <!-- 우측 화살표 -->
    <button
      id="next-btn"
      class="hidden absolute right-0 top-1/2 transform -translate-y-1/2 translate-x-4 z-10 bg-white rounded-full p-3 shadow-lg hover:bg-gray-50 transition"
    >
      <i class="fas fa-chevron-right text-gray-600 text-xl"></i>
    </button>
  </div>

  <!-- 전체 공연 보기 버튼 -->
  <div class="text-center mt-12">
    <a
      href="{% url 'performances:index' %}"
      class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 transition"
    >
      전체 공연 목록 보기
      <i class="fas fa-arrow-right ml-2"></i>
    </a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
  // 전역 변수
  let currentGenre = '{{ genres.0.code }}';
  let allPerformances = [];
  let currentPage = 0;
  const itemsPerPage = 5;

  // DOM 요소
  const genreTabs = document.querySelectorAll('.genre-tab');
  const performancesList = document.getElementById('performances-list');
  const loading = document.getElementById('loading');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  // 초기 로드
  document.addEventListener('DOMContentLoaded', () => {
    loadBoxOffice(currentGenre);
  });

  // 탭 클릭 이벤트
  genreTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const genre = tab.dataset.genre;

      // 탭 활성화 상태 변경
      genreTabs.forEach(t => {
        t.classList.remove('border-indigo-500', 'text-indigo-600');
        t.classList.add('border-transparent', 'text-gray-500');
      });
      tab.classList.remove('border-transparent', 'text-gray-500');
      tab.classList.add('border-indigo-500', 'text-indigo-600');

      // 데이터 로드
      currentGenre = genre;
      currentPage = 0;
      loadBoxOffice(genre);
    });
  });

  // 박스오피스 데이터 로드
  function loadBoxOffice(genre) {
    loading.classList.remove('hidden');
    performancesList.innerHTML = '';

    axios.get('/performances/boxoffice-genre/', {
      params: { genre: genre }
    })
    .then(response => {
      loading.classList.add('hidden');

      if (response.data.success) {
        allPerformances = response.data.data;
        renderPerformances();
      } else {
        showError('데이터를 불러올 수 없습니다.');
      }
    })
    .catch(error => {
      loading.classList.add('hidden');
      console.error('Error:', error);
      showError('오류가 발생했습니다.');
    });
  }

  // 공연 목록 렌더링
  function renderPerformances() {
    const start = currentPage * itemsPerPage;
    const end = start + itemsPerPage;
    const pageData = allPerformances.slice(start, end);

    performancesList.innerHTML = '';

    if (pageData.length === 0) {
      performancesList.innerHTML = `
        <div class="col-span-full text-center py-12 text-gray-500">
          <i class="fas fa-exclamation-circle text-4xl mb-4"></i>
          <p>진행 중인 공연이 없습니다.</p>
        </div>
      `;
      updateNavButtons();
      return;
    }

    pageData.forEach((perf, index) => {
      const rankBadge = getRankBadge(perf.rank);
      const card = `
        <a href="/performances/${perf.mt20id}/" class="block bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition transform hover:-translate-y-1">
          <div class="relative">
            ${rankBadge}
            <img
              src="${perf.poster}"
              alt="${perf.prfnm}"
              class="w-full h-72 object-cover"
              onerror="this.src='https://via.placeholder.com/200x280?text=No+Poster'"
            >
          </div>
          <div class="p-4">
            <h3 class="font-bold text-lg mb-2 line-clamp-2 h-14">${perf.prfnm}</h3>
            <p class="text-sm text-gray-600 mb-1">
              <i class="fas fa-map-marker-alt mr-1"></i>${perf.fcltynm || '정보 없음'}
            </p>
            <p class="text-sm text-gray-600 mb-1">
              <i class="fas fa-calendar mr-1"></i>${formatDate(perf.prfpdfrom)} ~ ${formatDate(perf.prfpdto)}
            </p>
            <p class="text-xs text-gray-500 mt-2">
              <i class="fas fa-tag mr-1"></i>${perf.genrenm || ''}
            </p>
          </div>
        </a>
      `;
      performancesList.innerHTML += card;
    });

    updateNavButtons();
  }

  // 순위 뱃지 생성
  function getRankBadge(rank) {
    let bgColor = 'bg-gray-600';
    if (rank === 1) bgColor = 'bg-yellow-500';
    else if (rank === 2) bgColor = 'bg-gray-400';
    else if (rank === 3) bgColor = 'bg-orange-600';

    return `
      <div class="absolute top-2 left-2 ${bgColor} text-white font-bold px-3 py-1 rounded-full text-sm z-10 shadow-lg">
        ${rank}위
      </div>
    `;
  }

  // 날짜 포맷
  function formatDate(dateStr) {
    if (!dateStr) return '';
    return dateStr.replace(/-/g, '.');
  }

  // 네비게이션 버튼 업데이트
  function updateNavButtons() {
    const totalPages = Math.ceil(allPerformances.length / itemsPerPage);

    if (currentPage > 0) {
      prevBtn.classList.remove('hidden');
    } else {
      prevBtn.classList.add('hidden');
    }

    if (currentPage < totalPages - 1) {
      nextBtn.classList.remove('hidden');
    } else {
      nextBtn.classList.add('hidden');
    }
  }

  // 이전 페이지
  prevBtn.addEventListener('click', () => {
    if (currentPage > 0) {
      currentPage--;
      renderPerformances();
    }
  });

  // 다음 페이지
  nextBtn.addEventListener('click', () => {
    const totalPages = Math.ceil(allPerformances.length / itemsPerPage);
    if (currentPage < totalPages - 1) {
      currentPage++;
      renderPerformances();
    }
  });

  // 에러 표시
  function showError(message) {
    performancesList.innerHTML = `
      <div class="col-span-full text-center py-12 text-red-500">
        <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
        <p>${message}</p>
      </div>
    `;
  }
</script>

{% endblock %}
